<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 3D Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .test-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* ===== ANIMATED 3D BACKGROUND ===== */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Floating Documents */
        .floating-doc {
            position: absolute;
            opacity: 0.15;
            animation: float-diagonal 25s infinite ease-in-out;
            filter: blur(0.5px);
            color: rgba(180, 255, 0, 0.3);
        }

        .floating-doc:nth-child(2) { top: 10%; left: 5%; font-size: 8rem; animation-delay: 0s; animation-duration: 30s; }
        .floating-doc:nth-child(3) { top: 60%; left: 80%; font-size: 6rem; animation-delay: -5s; animation-duration: 35s; }
        .floating-doc:nth-child(4) { top: 30%; left: 70%; font-size: 7rem; animation-delay: -10s; animation-duration: 28s; }
        .floating-doc:nth-child(5) { top: 70%; left: 15%; font-size: 5rem; animation-delay: -15s; animation-duration: 32s; }
        .floating-doc:nth-child(6) { top: 85%; left: 60%; font-size: 9rem; animation-delay: -20s; animation-duration: 38s; }

        @keyframes float-diagonal {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(30px, -40px) rotate(5deg) scale(1.1); }
            50% { transform: translate(-20px, -80px) rotate(-3deg) scale(0.9); }
            75% { transform: translate(-40px, -40px) rotate(4deg) scale(1.05); }
        }

        /* Grid Lines Animation */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(180, 255, 0, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180, 255, 0, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Glowing Particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #b4ff00;
            border-radius: 50%;
            box-shadow: 0 0 20px #b4ff00, 0 0 40px #b4ff00, 0 0 60px rgba(180, 255, 0, 0.5);
            animation: particle-float 15s infinite ease-in-out;
            opacity: 0.8;
        }

        .particle:nth-child(7) { top: 20%; left: 20%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(8) { top: 50%; left: 50%; animation-delay: -3s; animation-duration: 15s; }
        .particle:nth-child(9) { top: 70%; left: 30%; animation-delay: -6s; animation-duration: 18s; }
        .particle:nth-child(10) { top: 30%; left: 80%; animation-delay: -9s; animation-duration: 14s; }
        .particle:nth-child(11) { top: 80%; left: 70%; animation-delay: -12s; animation-duration: 16s; }

        @keyframes particle-float {
            0%, 100% { transform: translate(0, 0); opacity: 0.5; }
            25% { transform: translate(100px, -50px); opacity: 0.7; }
            50% { transform: translate(50px, -100px); opacity: 0.4; }
            75% { transform: translate(-50px, -150px); opacity: 0.6; }
        }

        /* Test Content */
        .test-content {
            position: relative;
            z-index: 1;
            color: #fff;
            text-align: center;
            padding: 100px 20px;
        }

        .test-content h1 {
            font-size: 3rem;
            color: #b4ff00;
            margin-bottom: 20px;
        }

        .test-content p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
        }

        .indicator {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(180, 255, 0, 0.1);
            border: 2px solid #b4ff00;
            border-radius: 5px;
            margin: 10px;
        }

        .visible { color: #00ff00; font-weight: bold; }
        .not-visible { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- Animated Background -->
        <div class="animated-background">
            <!-- Grid Lines -->
            <div class="grid-lines"></div>
            
            <!-- Floating Documents -->
            <div class="floating-doc">📄</div>
            <div class="floating-doc">📊</div>
            <div class="floating-doc">📈</div>
            <div class="floating-doc">📋</div>
            <div class="floating-doc">📑</div>
            
            <!-- Glowing Particles -->
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <!-- Test Content -->
        <div class="test-content">
            <h1>🎨 3D Animation Test</h1>
            <p>Cek apakah animasi terlihat di browser anda</p>
            
            <div class="indicator">
                <strong>Grid Lines:</strong> 
                <span id="grid-status">Checking...</span>
            </div>
            
            <div class="indicator">
                <strong>Floating Docs:</strong> 
                <span id="docs-status">Checking...</span>
            </div>
            
            <div class="indicator">
                <strong>Particles:</strong> 
                <span id="particles-status">Checking...</span>
            </div>

            <div style="margin-top: 40px;">
                <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.6);">
                    Jika anda melihat:
                    <br/>✅ Grid lines bergerak diagonal
                    <br/>✅ Icon documents floating (📄📊📈)
                    <br/>✅ Glowing green particles
                    <br/><br/>
                    Maka animasi <strong style="color: #b4ff00;">WORKING!</strong>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Simple detection
        setTimeout(() => {
            const gridLines = document.querySelector('.grid-lines');
            const floatingDocs = document.querySelectorAll('.floating-doc');
            const particles = document.querySelectorAll('.particle');

            document.getElementById('grid-status').innerHTML = 
                gridLines ? '<span class="visible">✓ VISIBLE</span>' : '<span class="not-visible">✗ NOT FOUND</span>';
            
            document.getElementById('docs-status').innerHTML = 
                floatingDocs.length > 0 ? `<span class="visible">✓ ${floatingDocs.length} DOCS VISIBLE</span>` : '<span class="not-visible">✗ NOT FOUND</span>';
            
            document.getElementById('particles-status').innerHTML = 
                particles.length > 0 ? `<span class="visible">✓ ${particles.length} PARTICLES VISIBLE</span>` : '<span class="not-visible">✗ NOT FOUND</span>';
        }, 500);
    </script>
</body>
</html>
